[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestration-engine"
version = "0.1.0"
description = "Production-grade multi-agent supervisor and workflow orchestration engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "agent-orchestration-engine contributors" }]
keywords = ["multi-agent", "orchestration", "workflow", "llm", "supervisor", "dag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg==0.31.0",
  "alembic==1.19.1",
  "pgvector==0.4.1",
  "redis==8.1.0",
  "httpx==0.28.1",
  "typer==0.27.1",
  "rich==15.0.0",
  "structlog==26.1.0",
  "tenacity==9.1.4",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "prometheus-client==0.26.0",
  "pyyaml==6.0.3",
  # JSON Schema validation for tool arguments: enforcement happens in the
  # runtime before a tool runs, not by trusting the model to comply.
  "jsonschema==4.26.0",
  "tabulate==0.9.0",
]

[project.optional-dependencies]
analysis = ["pandas==2.3.3", "matplotlib==3.10.7"]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "pytest-timeout==2.4.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "pre-commit==4.4.0",
  "bandit==1.9.2",
  "pip-audit==2.9.0",
  "freezegun==1.5.5",
  "types-pyyaml",
  "types-tabulate",
]

[project.scripts]
orchestrator = "orchestration.cli.main:app"

[project.urls]
Documentation = "https://github.com/example/agent-orchestration-engine/tree/main/docs"
Source = "https://github.com/example/agent-orchestration-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestration = ["py.typed"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "DTZ",       # naive datetimes -- important: all timestamps must be tz-aware
  "T20",       # no print() in library code
  "SIM",       # simplify
  "PTH",       # pathlib
  "RUF",
  "ASYNC",     # async antipatterns
  "S",         # bandit-style security rules
]
ignore = [
  "S101",   # assert: allowed (used in tests and internal invariants)
  "B008",   # function call in default arg: FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "T20"]
"benchmarks/**" = ["T20"]
"examples/**" = ["T20"]
"scripts/**" = ["T20"]
"src/orchestration/cli/**" = ["T20"]   # CLI legitimately writes to stdout

[tool.ruff.lint.isort]
known-first-party = ["orchestration"]

# ----------------------------------------------------------------------------
# MyPy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "benchmarks.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pgvector.*", "tabulate.*", "matplotlib.*", "pandas.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast isolated tests, no external services",
  "integration: requires PostgreSQL and Redis",
  "failure: fault-injection tests",
  "benchmark: evaluation benchmark scenarios",
  "slow: long-running tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pkg_resources.*"]

[tool.coverage.run]
source = ["src/orchestration"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "benchmarks"]
