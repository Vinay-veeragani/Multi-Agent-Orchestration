# Self-contained stack: its own PostgreSQL+pgvector and Redis, not the ones
# installed on the host for local development. `migrate` runs once (`alembic
# upgrade head`) and exits; `app` waits for it to succeed before starting, so
# there is exactly one place the schema gets created from -- the same
# migrations the bare-metal setup uses (see migrations/README.md).
#
# Quick start:
#   docker compose up --build
#   curl http://127.0.0.1:8000/health
#
# Compose CLI auto-loads a top-level `.env` for ${VAR} substitution -- and
# this repo already has one, for the bare-metal setup, full of ORCH_*
# variables. Every value below that a user might reasonably want to override
# therefore uses a COMPOSE_*-prefixed name instead of the ORCH_* name the
# container actually receives, so this file's defaults are never silently
# shadowed by unrelated settings meant for a host-installed PostgreSQL/Redis.
# Override any of them with a shell export, or `docker compose --env-file
# docker/.env.docker up`.

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${COMPOSE_POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:-orch_docker_dev_only}
      POSTGRES_DB: ${COMPOSE_POSTGRES_DB:-orchestration}
    volumes:
      - orchestration_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSE_POSTGRES_USER:-orchestrator} -d ${COMPOSE_POSTGRES_DB:-orchestration}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${COMPOSE_POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${COMPOSE_REDIS_PORT:-6379}:6379"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      ORCH_PG_DSN: postgresql+asyncpg://${COMPOSE_POSTGRES_USER:-orchestrator}:${COMPOSE_POSTGRES_PASSWORD:-orch_docker_dev_only}@postgres:5432/${COMPOSE_POSTGRES_DB:-orchestration}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command:
      - "uvicorn"
      - "orchestration.api.app:create_app"
      - "--factory"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      ORCH_PG_DSN: postgresql+asyncpg://${COMPOSE_POSTGRES_USER:-orchestrator}:${COMPOSE_POSTGRES_PASSWORD:-orch_docker_dev_only}@postgres:5432/${COMPOSE_POSTGRES_DB:-orchestration}
      ORCH_REDIS_URL: redis://redis:6379/1
      ORCH_REDIS_NAMESPACE: orch
      ORCH_API_HOST: 0.0.0.0
      ORCH_API_PORT: "8000"
      # Dev-only placeholder. Set COMPOSE_API_KEYS before exposing this
      # beyond localhost -- the container never sees the bare-metal .env's
      # ORCH_API_KEYS, deliberately.
      ORCH_API_KEYS: ${COMPOSE_API_KEYS:-CHANGE_ME_local_dev_key}
      ORCH_API_REQUIRE_AUTH: "true"
      ORCH_DEFAULT_PROVIDER: mock
      ORCH_OPENAI_API_KEY: ${COMPOSE_OPENAI_API_KEY:-}
      ORCH_ANTHROPIC_API_KEY: ${COMPOSE_ANTHROPIC_API_KEY:-}
      ORCH_GEMINI_API_KEY: ${COMPOSE_GEMINI_API_KEY:-}
      ORCH_OLLAMA_ENABLED: "false"
      ORCH_TRACING_ENABLED: "false"
      ORCH_LOG_FORMAT: json
    ports:
      - "${COMPOSE_API_PORT:-8000}:8000"
    volumes:
      - orchestration_artifacts:/app/.artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  orchestration_pgdata:
  orchestration_artifacts:
