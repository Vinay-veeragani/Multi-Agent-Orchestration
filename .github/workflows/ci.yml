name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Every skipped check id is justified in pyproject.toml's [tool.bandit].
      - run: bandit -c pyproject.toml -r src
      # A version pin with a known CVE and no fix available yet is a signal
      # to track, not a merge-blocker -- hence a report rather than a hard
      # failure here. Unpinned/transitive vulnerabilities (the kind that
      # arrive silently between runs) are exactly what this job exists to
      # catch loudly.
      - run: pip-audit --desc

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m unit -v

  integration:
    name: Integration tests (real PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orch_ci_test_only
          POSTGRES_DB: orchestration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORCH_PG_TEST_DSN: postgresql+asyncpg://orchestrator:orch_ci_test_only@127.0.0.1:5432/orchestration_test
      ORCH_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m integration -v

  benchmark-smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    needs: integration
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orch_ci_test_only
          POSTGRES_DB: orchestration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORCH_PG_TEST_DSN: postgresql+asyncpg://orchestrator:orch_ci_test_only@127.0.0.1:5432/orchestration_test
      ORCH_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # A small, fast slice of the full 54-scenario x 4-arm benchmark
      # (see docs/evaluation-benchmark.md for the full run) -- enough to
      # catch an engine-side regression in the categories most sensitive to
      # one (retry recovery, human approval) without adding real time to
      # every PR. --no-persist: this is a CI database that won't exist by
      # the time anyone could look the report up in it.
      - run: |
          orchestrator benchmark \
            --category simple --category retry --category approval \
            --test-db
      - name: Fail if the retry-enabled arms regressed
        run: |
          python - <<'PY'
          import glob, json, os, sys

          # By mtime, not filename: report ids are random hex, and the repo
          # already ships one committed report (see docs/evaluation-benchmark.md)
          # that a lexicographic max() could easily out-sort the one this job
          # just produced.
          latest = max(glob.glob("benchmarks/results/*.json"), key=os.path.getmtime)
          report = json.load(open(latest, encoding="utf-8"))
          arms = {a["arm"]: a for a in report["arms"]}
          for name in ("supervisor-retry", "supervisor-parallel"):
              arm = arms[name]
              if arm["scenarios_passed"] != arm["scenarios_run"]:
                  print(f"{name}: {arm['scenarios_passed']}/{arm['scenarios_run']} -- expected all to pass")
                  sys.exit(1)
          print("benchmark smoke test passed")
          PY

  docker-smoke:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose --env-file docker/.env.docker.example up --build -d
      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
